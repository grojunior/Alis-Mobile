<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alis - Mobile Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 14px 16px;
      font-weight: bold;
      border-bottom: 1px solid #333;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      background-color: #005c4b;
      color: #fff;
      align-self: flex-end;
    }
    .alis {
      background-color: #2d2d2d;
      color: #f0f0f0;
      align-self: flex-start;
      border: 1px solid #444;
    }
    .input-container {
      display: flex;
      padding: 12px;
      background-color: #1e1e1e;
      border-top: 1px solid #333;
      gap: 8px;
      box-sizing: border-box;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
    }
    button {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:active {
      background-color: #005999;
    }
    #micBtn {
      background-color: #333;
      font-size: 18px;
      padding: 0 12px;
    }
    #micBtn.gravando {
      background-color: #cc0000;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <span>🤖 Alis Mobile</span>
    <span style="font-size: 11px; color: #888;">GitHub PWA</span>
  </header>

  <div id="chat-container">
    <div class="message alis">Fala aí! Alis mobile pronta na área. Qual é a boa?</div>
  </div>

  <div class="input-container">
    <button id="micBtn" title="Falar por voz">🎤</button>
    <input type="text" id="userInput" placeholder="Digite seu comando..." autocomplete="off">
    <button id="sendBtn">Enviar</button>
  </div>

  <script>
    // URL oficial do Apps Script (Web App /exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8rYVwK8NP78v-ZPLPD1vg8Z2Bplh7MFYuGUo_8YQWskHwsORJz-q_DlwRR-Tlg6Iv/exec";

    document.getElementById("sendBtn").addEventListener("click", () => enviarTexto());
    document.getElementById("userInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") enviarTexto();
    });

    async function enviarTexto(textoPersonalizado) {
      const input = document.getElementById("userInput");
      const texto = textoPersonalizado || input.value.trim();
      if (!texto) return;

      adicionarMensagem(texto, "user");
      if (!textoPersonalizado) input.value = "";
      
      const payload = {
        origem: "github_pwa",
        message: {
          chat: { id: "mobile_pwa" },
          text: texto
        }
      };

      adicionarMensagem("Pensando...", "alis loading");

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });

        removerLoading();

        if (response.ok) {
          const respostaTexto = await response.text();
          adicionarMensagem(respostaTexto || "Comando processado com sucesso!", "alis");
        } else {
          adicionarMensagem(`Erro no servidor: ${response.status}`, "alis");
        }
      } catch (error) {
        removerLoading();
        adicionarMensagem("Erro de rede ao conectar com o Apps Script.", "alis");
      }
    }

    // Suporte a ditado por voz nativo do navegador do celular
    const micBtn = document.getElementById("micBtn");
    let recognition;
    
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.addEventListener('click', () => {
        try {
          recognition.start();
          micBtn.classList.add('gravando');
          micBtn.innerText = "🛑";
        } catch (e) {
          recognition.stop();
        }
      });

      recognition.onresult = (event) => {
        const speechResult = event.results[0][0].transcript;
        micBtn.classList.remove('gravando');
        micBtn.innerText = "🎤";
        enviarTexto(speechResult);
      };

      recognition.onerror = () => {
        micBtn.classList.remove('gravando');
        micBtn.innerText = "🎤";
      };

      recognition.onend = () => {
        micBtn.classList.remove('gravando');
        micBtn.innerText = "🎤";
      };
    } else {
      micBtn.style.display = 'none';
    }

    function adicionarMensagem(texto, remetente) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = `message ${remetente}`;
      div.innerText = texto;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function removerLoading() {
      const container = document.getElementById("chat-container");
      const loading = container.querySelector(".loading");
      if (loading) loading.remove();
    }
  </script>
</body>
</html>
